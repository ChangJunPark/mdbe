<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>mdbe</title>
    <link rel="stylesheet" href="./css/editor.css" />
  </head>
  <body>
    <div class="mdbe">
      <header class="mdbe__toolbar">
        <button
          id="toggle-worktree"
          class="mdbe__tree-toggle"
          type="button"
          aria-label="Toggle worktree"
          title="Toggle worktree"
        >
          <span></span><span></span><span></span>
        </button>

        <a
          class="mdbe__brand"
          href="https://github.com/ChangJunPark/mdbe"
          target="_blank"
          rel="noreferrer"
          title="Open the mdbe repository"
        >
          <img src="images/mdbe-logo.svg" alt="" />
          <strong>mdbe</strong>
        </a>

        <div class="mdbe__actions" role="toolbar" aria-label="Document actions">
          <button id="open-workspace" class="primary" type="button">
            Open folder
          </button>
          <button id="new-document" type="button">New</button>
          <button id="open-document" type="button">Open file</button>
          <button id="save-document" type="button">Save…</button>
          <button id="save-as-document" type="button">Save as</button>
        </div>

        <div class="mdbe__document-meta">
          <span id="file-name" title="Current file">untitled.md</span>
          <span id="save-status" class="mdbe__status" aria-live="polite"
            >Loading</span
          >
          <button
            id="toggle-appearance"
            class="mdbe__appearance-toggle"
            type="button"
            aria-haspopup="dialog"
            aria-controls="appearance-panel"
            aria-expanded="false"
            title="Editor appearance"
          >
            Aa
          </button>
          <button id="toggle-theme" type="button" title="Toggle theme">
            Dark
          </button>
        </div>
      </header>

      <aside
        id="update-banner"
        class="mdbe__update-banner"
        aria-label="Extension update"
        hidden
      >
        <div>
          <strong id="update-title">mdbe update ready</strong>
          <span id="update-message">Save your work before restarting.</span>
        </div>
        <div class="mdbe__update-actions">
          <button id="dismiss-update" type="button">Later</button>
          <button id="apply-update" class="primary" type="button">
            Restart to update
          </button>
        </div>
      </aside>

      <section
        id="appearance-panel"
        class="mdbe__appearance-panel"
        role="dialog"
        aria-label="Editor appearance"
        hidden
      >
        <div class="mdbe__appearance-heading">
          <strong>Editor appearance</strong>
          <button
            id="close-appearance"
            class="icon-button"
            type="button"
            aria-label="Close editor appearance"
          >
            ×
          </button>
        </div>

        <label class="mdbe__appearance-field" for="editor-font-family">
          <span>Font</span>
          <select id="editor-font-family">
            <option value="pretendard">Pretendard</option>
            <option value="system">System sans</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </label>

        <label class="mdbe__appearance-field" for="editor-font-size">
          <span>
            Size
            <output id="editor-font-size-value" for="editor-font-size"
              >16 px</output
            >
          </span>
          <input
            id="editor-font-size"
            type="range"
            min="12"
            max="24"
            step="1"
            value="16"
          />
        </label>

        <label class="mdbe__appearance-field" for="editor-line-height">
          <span>
            Line height
            <output id="editor-line-height-value" for="editor-line-height"
              >1.72</output
            >
          </span>
          <input
            id="editor-line-height"
            type="range"
            min="1.2"
            max="2.4"
            step="0.01"
            value="1.72"
          />
        </label>

        <button id="reset-appearance" type="button">Reset to defaults</button>
      </section>

      <main class="mdbe__workspace">
        <aside
          id="worktree"
          class="mdbe__worktree"
          aria-label="Workspace files"
        >
          <div class="mdbe__worktree-heading">
            <div>
              <span class="mdbe__eyebrow">Worktree</span>
              <strong id="workspace-name">No folder open</strong>
            </div>
            <button
              id="refresh-workspace"
              class="icon-button"
              type="button"
              aria-label="Refresh worktree"
              title="Refresh worktree"
              disabled
            >
              ↻
            </button>
          </div>
          <div id="worktree-empty" class="mdbe__worktree-empty">
            <p>Choose a folder to browse its Markdown files.</p>
            <button id="open-workspace-empty" type="button">Open folder</button>
          </div>
          <nav
            id="file-tree"
            class="mdbe__file-tree"
            role="tree"
            aria-label="Markdown files"
          ></nav>
        </aside>

        <section class="mdbe__document" aria-label="Markdown document">
          <div class="mdbe__document-bar">
            <span id="current-path">untitled.md</span>
            <span>WYSIWYG Markdown</span>
          </div>
          <div class="mdbe__editor-scroll">
            <div id="milkdown-editor" class="mdbe__editor-host"></div>
          </div>
        </section>
      </main>
    </div>

    <input
      id="fallback-file-input"
      type="file"
      accept=".md,.mdx,.mkd,.markdown,text/markdown,text/plain"
      hidden
    />
    <script src="./js/editor.js"></script>
  </body>
</html>
